<title>Apnajoda Color Palettes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #666666;
  --border: #dddddd;
  --accent: #e85d75;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a;
    --fg: #ffffff;
    --muted: #888888;
    --border: #333333;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0a0a0a;
  --fg: #ffffff;
  --muted: #888888;
  --border: #333333;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
  line-height: 1.6;
}

h1 {
  font-size: 28px;
  font-weight: 700;
  margin: 24px 0 32px 0;
  text-align: center;
}

.palettes {
  display: grid;
  gap: 24px;
  max-width: 900px;
  margin: 0 auto;
}

.palette {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.palette:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.palette.selected {
  box-shadow: 0 0 0 3px var(--accent);
}

.palette-name {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

.palette-description {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 16px;
}

.colors {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.color-box {
  flex: 1;
  min-width: 100px;
  height: 60px;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg);
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.button-group {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: center;
}

button {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.9;
}

.select-btn {
  background: var(--accent);
  color: white;
}

.info {
  text-align: center;
  margin: 32px auto;
  padding: 16px;
  background: var(--muted);
  opacity: 0.1;
  border-radius: 8px;
  font-size: 12px;
  color: var(--muted);
}
</style>

<h1>🎨 Apnajoda Color Palettes</h1>

<div class="info">
  कोई भी palette चुनें। App में इसे apply किया जाएगा।
</div>

<div class="palettes" id="palettes"></div>

<div class="button-group" style="margin-top: 40px;">
  <button onclick="savePalette()" class="select-btn">Selected Palette को Save करें</button>
</div>

<script>
const palettes = [
  {
    id: 1,
    name: "🌹 Rose & Gold",
    description: "Warm, romantic, premium feel",
    colors: {
      primary: "#e85d75",
      secondary: "#f5a3ad",
      accent: "#d4a574",
      background: "#fff9f7",
      text: "#2a2a2a"
    }
  },
  {
    id: 2,
    name: "🌊 Ocean Blue",
    description: "Fresh, modern, trustworthy",
    colors: {
      primary: "#0066cc",
      secondary: "#4da6ff",
      accent: "#00cc99",
      background: "#f0f7ff",
      text: "#1a3a52"
    }
  },
  {
    id: 3,
    name: "🌺 Coral Sunset",
    description: "Energetic, friendly, vibrant",
    colors: {
      primary: "#ff6b6b",
      secondary: "#ffa06b",
      accent: "#ffb347",
      background: "#fff5f0",
      text: "#3d2817"
    }
  },
  {
    id: 4,
    name: "💜 Purple Dreams",
    description: "Creative, mystical, elegant",
    colors: {
      primary: "#9b59b6",
      secondary: "#c39bd3",
      accent: "#8e44ad",
      background: "#f9f6ff",
      text: "#2c1a3d"
    }
  },
  {
    id: 5,
    name: "🌿 Sage Green",
    description: "Calm, natural, balanced",
    colors: {
      primary: "#52a67a",
      secondary: "#7ecb9e",
      accent: "#4a7c59",
      background: "#f5faf8",
      text: "#1a3a2a"
    }
  },
  {
    id: 6,
    name: "🌙 Midnight Plum",
    description: "Deep, luxurious, sophisticated",
    colors: {
      primary: "#2c1a3d",
      secondary: "#6b4c8a",
      accent: "#c77dda",
      background: "#1a0f26",
      text: "#e8d5f0"
    }
  }
];

let selectedId = null;

function renderPalettes() {
  const container = document.getElementById("palettes");
  container.innerHTML = palettes.map(p => `
    <div class="palette" id="palette-${p.id}" onclick="selectPalette(${p.id})">
      <div class="palette-name">${p.name}</div>
      <div class="palette-description">${p.description}</div>
      <div class="colors">
        ${Object.entries(p.colors).map(([key, color]) => `
          <div class="color-box" style="background-color: ${color}; color: ${getContrastColor(color)};">
            <span>${color}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

function selectPalette(id) {
  selectedId = id;
  document.querySelectorAll(".palette").forEach(p => p.classList.remove("selected"));
  document.getElementById(`palette-${id}`).classList.add("selected");
}

function getContrastColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 155 ? "#000" : "#fff";
}

function savePalette() {
  if (!selectedId) {
    alert("कोई palette चुनें!");
    return;
  }
  const selected = palettes.find(p => p.id === selectedId);
  console.log("Selected palette:", selected);
  alert(`✅ "${selected.name}" को save किया गया। Backend में apply करेंगे।`);
}

renderPalettes();
selectPalette(1);
</script>
