<title>Apnajoda Color Themes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #666666;
  --border: #dddddd;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a;
    --fg: #ffffff;
    --muted: #888888;
    --border: #333333;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0a0a0a;
  --fg: #ffffff;
  --muted: #888888;
  --border: #333333;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
}

h1 {
  font-size: 28px;
  font-weight: 700;
  margin: 24px 0 32px 0;
  text-align: center;
}

.themes {
  display: grid;
  gap: 24px;
  max-width: 900px;
  margin: 0 auto 40px;
}

.theme {
  border: 2px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.theme:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.15);
}

.theme.selected {
  border-color: #000;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #000;
}

.theme-header {
  padding: 20px;
  background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.theme-name {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 4px 0;
}

.theme-desc {
  font-size: 14px;
  opacity: 0.9;
  margin: 0;
}

.preview {
  padding: 20px;
  background: var(--bg);
}

.preview-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  align-items: center;
}

.preview-col {
  flex: 1;
}

.preview-label {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.color-swatch {
  width: 100%;
  height: 60px;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  text-shadow: 0 1px 1px rgba(255,255,255,0.3);
}

.button-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.demo-btn {
  flex: 1;
  padding: 10px 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}

.demo-btn-primary {
  background: var(--theme-primary);
  color: white;
}

.demo-btn-secondary {
  background: var(--theme-secondary);
  color: white;
}

.demo-btn-accent {
  background: var(--theme-accent);
  color: white;
}

.button-group {
  display: flex;
  gap: 8px;
  margin-top: 32px;
  justify-content: center;
}

button {
  padding: 14px 32px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}

.select-btn {
  background: #2a2a2a;
  color: white;
}

.select-btn:hover {
  opacity: 0.9;
}

.info {
  text-align: center;
  margin: 24px auto;
  font-size: 14px;
  color: var(--muted);
}
</style>

<h1>🎨 Apnajoda Color Themes</h1>

<div class="info">
  हर theme में सभी colors का combination दिया है। कोई भी theme चुनें।
</div>

<div class="themes" id="themes"></div>

<div class="button-group">
  <button onclick="savetheme()" class="select-btn">✅ Theme को Save करें</button>
</div>

<script>
const themes = [
  {
    id: 1,
    name: "🌹 Rose Premium",
    desc: "Romantic, warm, premium feel",
    colors: {
      primary: "#e85d75",
      secondary: "#f5a3ad",
      accent: "#d4a574",
      success: "#52a67a",
      warning: "#f39c12",
      error: "#e74c3c",
      background: "#fafafa",
      surface: "#ffffff",
      text: "#2a2a2a",
      muted: "#777777"
    }
  },
  {
    id: 2,
    name: "🌊 Ocean Fresh",
    desc: "Modern, fresh, trustworthy",
    colors: {
      primary: "#0066cc",
      secondary: "#4da6ff",
      accent: "#00cc99",
      success: "#27ae60",
      warning: "#f39c12",
      error: "#e74c3c",
      background: "#f5f9ff",
      surface: "#ffffff",
      text: "#1a1a1a",
      muted: "#666666"
    }
  },
  {
    id: 3,
    name: "🌺 Coral Vibrant",
    desc: "Energetic, friendly, fun",
    colors: {
      primary: "#ff6b6b",
      secondary: "#ffa06b",
      accent: "#ffb347",
      success: "#52a67a",
      warning: "#f39c12",
      error: "#e74c3c",
      background: "#fff9f7",
      surface: "#ffffff",
      text: "#2a2a2a",
      muted: "#777777"
    }
  },
  {
    id: 4,
    name: "💜 Purple Magic",
    desc: "Creative, elegant, mystical",
    colors: {
      primary: "#9b59b6",
      secondary: "#c39bd3",
      accent: "#8e44ad",
      success: "#52a67a",
      warning: "#f39c12",
      error: "#e74c3c",
      background: "#f9f6ff",
      surface: "#ffffff",
      text: "#2c1a3d",
      muted: "#777777"
    }
  },
  {
    id: 5,
    name: "🌿 Green Calm",
    desc: "Natural, balanced, peaceful",
    colors: {
      primary: "#52a67a",
      secondary: "#7ecb9e",
      accent: "#4a7c59",
      success: "#27ae60",
      warning: "#f39c12",
      error: "#e74c3c",
      background: "#f5faf8",
      surface: "#ffffff",
      text: "#1a3a2a",
      muted: "#666666"
    }
  },
  {
    id: 6,
    name: "🌙 Midnight Luxury",
    desc: "Deep, sophisticated, luxurious",
    colors: {
      primary: "#2c1a3d",
      secondary: "#6b4c8a",
      accent: "#c77dda",
      success: "#52a67a",
      warning: "#ffb347",
      error: "#ff6b6b",
      background: "#1a0f26",
      surface: "#2d1b3d",
      text: "#e8d5f0",
      muted: "#a0a0a0"
    }
  }
];

let selectedId = null;

function renderThemes() {
  const container = document.getElementById("themes");
  container.innerHTML = themes.map(t => `
    <div class="theme" id="theme-${t.id}" onclick="selecttheme(${t.id})"
         style="--theme-primary: ${t.colors.primary}; --theme-secondary: ${t.colors.secondary};">
      <div class="theme-header">
        <h2 class="theme-name">${t.name}</h2>
        <p class="theme-desc">${t.desc}</p>
      </div>
      <div class="preview">
        <!-- Primary -->
        <div class="preview-row">
          <div class="preview-col">
            <div class="preview-label">Primary (CTA)</div>
            <div class="color-swatch" style="background: ${t.colors.primary}; color: ${getContrast(t.colors.primary)};">
              ${t.colors.primary}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Secondary</div>
            <div class="color-swatch" style="background: ${t.colors.secondary}; color: ${getContrast(t.colors.secondary)};">
              ${t.colors.secondary}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Accent</div>
            <div class="color-swatch" style="background: ${t.colors.accent}; color: ${getContrast(t.colors.accent)};">
              ${t.colors.accent}
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="preview-row">
          <div class="preview-col">
            <div class="preview-label">Success</div>
            <div class="color-swatch" style="background: ${t.colors.success}; color: white;">
              ${t.colors.success}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Warning</div>
            <div class="color-swatch" style="background: ${t.colors.warning}; color: ${getContrast(t.colors.warning)};">
              ${t.colors.warning}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Error</div>
            <div class="color-swatch" style="background: ${t.colors.error}; color: white;">
              ${t.colors.error}
            </div>
          </div>
        </div>

        <!-- Background & Text -->
        <div class="preview-row">
          <div class="preview-col">
            <div class="preview-label">BG</div>
            <div class="color-swatch" style="background: ${t.colors.background}; color: ${getContrast(t.colors.background)}; border: 2px solid var(--border);">
              ${t.colors.background}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Text</div>
            <div class="color-swatch" style="background: ${t.colors.text}; color: ${getContrast(t.colors.text)};">
              ${t.colors.text}
            </div>
          </div>
          <div class="preview-col">
            <div class="preview-label">Muted</div>
            <div class="color-swatch" style="background: ${t.colors.muted}; color: white;">
              ${t.colors.muted}
            </div>
          </div>
        </div>

        <!-- Demo Buttons -->
        <div class="button-row">
          <button class="demo-btn demo-btn-primary">Like ❤️</button>
          <button class="demo-btn demo-btn-secondary">Message 💬</button>
          <button class="demo-btn demo-btn-accent">Premium ⭐</button>
        </div>
      </div>
    </div>
  `).join("");
}

function selecttheme(id) {
  selectedId = id;
  document.querySelectorAll(".theme").forEach(t => t.classList.remove("selected"));
  document.getElementById(`theme-${id}`).classList.add("selected");
}

function getContrast(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 155 ? "#000" : "#fff";
}

function savetheme() {
  if (!selectedId) {
    alert("कोई theme चुनें!");
    return;
  }
  const selected = themes.find(t => t.id === selectedId);
  console.log("Selected theme:", selected);
  alert(`✅ "${selected.name}" को save किया गया!\n\nColors backend में apply होंगे।`);
}

renderThemes();
selecttheme(1);
</script>
